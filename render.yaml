# Render Blueprint — RaidOS Trading API
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys packages/app as a long-running Node service:
#   - pnpm build compiles TS to dist/
#   - start runs the compiled server on $PORT
#   - disk0 is a persistent disk mounted at /data so the SQLite DB survives
#     deploys and restarts (custodial wallet keys + trade history MUST persist;
#     do not downgrade to a free instance — free disks are ephemeral)
#
# One-time after first deploy: set BOOTSTRAP_SECRET in the Render dashboard
# (Environment tab), then register your account:
#   curl -X POST https://raidos-api.onrender.com/api/auth/register \
#     -H "X-Bootstrap-Secret: <your-secret>"
# The response contains your API key ONCE — paste it into the dashboard key modal.

services:
  - type: web
    name: raidos-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: cd packages/app && corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: cd packages/app && node dist/api/main.js
    healthCheckPath: /api/health
    disk:
      name: raidos-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /data/raidos.db
      - key: APP_MODE
        value: mock            # switch to live after keys are funded + audited
      - key: BOOTSTRAP_SECRET
        sync: false            # set in the Render dashboard; never commit it
      - key: SITE_DIR
        value: ""              # API-only; dashboard is served by GitHub Pages
