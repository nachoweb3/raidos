# Render Blueprint — RaidOS Trading API
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys packages/app as a long-running Node service.
#
# CURRENT: LIVE — APP_MODE=live broadcasts real transactions (Jupiter / 0x).
# Requires funded custodial wallets and a persistent disk (data survives restarts).
#
# BOOTSTRAP_SECRET is sync:false — set it in the Render dashboard:
#   Dashboard → raidos-api → Environment → Add Environment Variable
#   BOOTSTRAP_SECRET=<strong random value>
# Then register from the dashboard key modal (it asks for the secret after the
# first user exists):
#   curl -X POST https://<service>.onrender.com/api/auth/register \
#     -H "Content-Type: application/json" \
#     -d '{"bootstrapSecret":"<your-secret>"}'
# The response contains your API key ONCE — paste it into the dashboard key modal.

services:
  - type: web
    name: raidos-api
    runtime: node
    plan: starter           # persistent disk requires a paid plan
    region: oregon
    repo: https://github.com/nachoweb3/raidos
    branch: main
    autoDeploy: true
    buildCommand: cd packages/app && corepack enable && pnpm install --no-frozen-lockfile && pnpm build
    startCommand: cd packages/app && node dist/api/main.js
    healthCheckPath: /api/health
    disk:
      name: raidos-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /data/raidos.db
      - key: APP_MODE
        value: live          # real chain broadcasts; wallets must be funded
      - key: BOOTSTRAP_SECRET
        sync: false          # set in the Render dashboard; never commit it
      - key: SITE_DIR
        value: ""            # API-only; dashboard is served by GitHub Pages
      # Optional live-mode keys:
      # - key: ZERO_X_API_KEY     # 0x API key for EVM swaps (recommended)
      # - key: SOLANA_RPC_URL     # custom Solana RPC (default: mainnet-beta public)
      # - key: JUPITER_SWAP_API_URL  # default: https://api.jup.ag/swap/v1